name: mirrorchyan_release_note

on:
  workflow_dispatch:
    inputs:
      tag:
        default: ''
        required: false
  release:
    types: [edited]

jobs:
  mirrorchyan:
    if: ${{ github.repository_owner == 'bingyunhe' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - id: uploading
        uses: MirrorChyan/release-note-action@v1
        with:
          mirrorchyan_rid: hongxue-stronghold-companion
          version_name: ${{ inputs.tag || github.event.release.tag_name }}

          owner: bingyunhe
          repo: hongxue-stronghold-companion
          github_token: ${{ secrets.GITHUB_TOKEN }}
          upload_token: ${{ secrets.MirrorChyanUploadToken }}

name: PR Tests

on:
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  mirror_checksum:
    name: Mirror package checksum
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: python3 .github/scripts/test_mirror_checksum.py -v

  groups:
    name: Public tests (${{ matrix.group }})
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        group: [core, ui, update]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Select the exact tested commit
        shell: pwsh
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $mergeTree = git rev-parse 'HEAD^{tree}'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve merge tree' }
          $headTree = git rev-parse "$env:PR_HEAD_SHA`^{tree}"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve PR head tree' }
          if ($mergeTree -eq $headTree) {
            git checkout --detach $env:PR_HEAD_SHA
            if ($LASTEXITCODE -ne 0) { throw 'Cannot check out equivalent PR head' }
          }
      - name: Verify test-reuse and coverage decisions
        if: matrix.group == 'core'
        shell: pwsh
        run: |
          ./.github/scripts/Test-ReleaseTestReuse.ps1
          ./.github/scripts/Test-ParallelTests.ps1
      - name: Setup .NET
        uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: "8.0.x"
      - name: Verify portable entry points
        if: matrix.group == 'update'
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'test-results'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          ./.github/scripts/Test-PortableLauncher.ps1 | ConvertTo-Json | Set-Content (Join-Path $out 'portable-launcher.json')
          ./.github/scripts/Test-LegacyPortableLauncher.ps1 | ConvertTo-Json -Depth 5 | Set-Content (Join-Path $out 'legacy-launcher.json')
      - name: Run test group
        shell: pwsh
        run: ./.github/scripts/Invoke-TestGroup.ps1 -Group '${{ matrix.group }}' -ResultsDirectory "${{ runner.temp }}/test-results"
      - name: Capture Windows application errors
        if: failure() && matrix.group == 'ui'
        shell: pwsh
        run: wevtutil qe Application /q:"*[System[(Provider[@Name='.NET Runtime'] or Provider[@Name='Application Error'])]]" /c:5 /rd:true /f:text > "${{ runner.temp }}/test-results/windows-errors.log"
      - name: Upload group results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: test-results-${{ github.run_attempt }}-${{ matrix.group }}
          path: |
            ${{ runner.temp }}/test-results/*.txt
            ${{ runner.temp }}/test-results/*.json
            ${{ runner.temp }}/test-results/*.trx
            ${{ runner.temp }}/test-results/*.log
          retention-days: 14
          if-no-files-found: warn

  test:
    name: Windows .NET tests
    needs: [groups, mirror_checksum]
    if: always()
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Require all groups to succeed
        shell: pwsh
        run: |
          if ('${{ needs.groups.result }}' -ne 'success') { throw 'A public test group failed, was cancelled, or was skipped.' }
          if ('${{ needs.mirror_checksum.result }}' -ne 'success') { throw 'Mirror package checksum tests did not succeed.' }
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Select the exact tested commit
        shell: pwsh
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $mergeTree = git rev-parse 'HEAD^{tree}'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve merge tree' }
          $headTree = git rev-parse "$env:PR_HEAD_SHA`^{tree}"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve PR head tree' }
          if ($mergeTree -eq $headTree) {
            git checkout --detach $env:PR_HEAD_SHA
            if ($LASTEXITCODE -ne 0) { throw 'Cannot check out equivalent PR head' }
          }
      - name: Collect and verify complete test coverage
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'test-results'
          $sha = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve tested commit' }
          foreach ($group in @('core', 'ui', 'update')) {
            $folder = Join-Path $root $group
            gh run download $env:GITHUB_RUN_ID --repo $env:GITHUB_REPOSITORY --name "test-results-$env:GITHUB_RUN_ATTEMPT-$group" --dir $folder
            if ($LASTEXITCODE -ne 0) { throw "Cannot download results for $group" }
            $result = Get-Content -LiteralPath (Join-Path $folder 'execution-times.json') -Raw | ConvertFrom-Json
            if ($result.Group -ne $group -or $result.Sha -ne $sha -or $result.ExitCode -ne 0) { throw "Invalid test execution for $group" }
            [string[]]$names = Get-Content -LiteralPath (Join-Path $folder 'expected-tests.txt')
            [Array]::Sort($names, [StringComparer]::Ordinal)
            $list = $names -join "`n"
            if ($group -eq 'core') {
              $expected = $list
              Copy-Item -LiteralPath (Join-Path $folder 'expected-tests.txt') -Destination (Join-Path $root 'expected-tests.txt')
            } elseif ($list -cne $expected) { throw 'Test discovery differs between groups' }
          }
          ./.github/scripts/Write-TestTimingSummary.ps1 -ResultsDirectory $root
      - name: Upload test timings
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: test-timings-${{ github.run_attempt }}
          path: ${{ runner.temp }}/test-results/timing-summary.json
          retention-days: 14
          if-no-files-found: warn
      - name: Run data tests
        env:
          PYTHONIOENCODING: utf-8
        run: python -B -m unittest discover -s data/tests -p "test_*.py"
      - name: Record successful test evidence
        shell: pwsh
        run: |
          $sha = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve tested commit' }
          $folder = Join-Path $env:RUNNER_TEMP 'verified-tests'
          New-Item -ItemType Directory -Path $folder -Force | Out-Null
          @{ schema = 1; repository = $env:GITHUB_REPOSITORY; sha = $sha;
             runId = $env:GITHUB_RUN_ID; runAttempt = [int]$env:GITHUB_RUN_ATTEMPT;
             suite = 'public-windows-dotnet-python-v2'; runnerOS = $env:RUNNER_OS } |
            ConvertTo-Json | Set-Content -LiteralPath (Join-Path $folder 'result.json') -Encoding utf8
      - name: Upload test evidence
        uses: actions/upload-artifact@v7.0.2
        with:
          name: verified-tests-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verified-tests/result.json
          retention-days: 30
          if-no-files-found: error
